<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Namer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="https://social-vibecoding.beta.usernodelabs.org/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <main class="max-w-md mx-auto px-4 py-8 flex flex-col gap-5">

    <header class="flex flex-col items-center gap-4">
      <h1 class="text-2xl font-bold">Namer</h1>
      <nav class="w-full grid grid-cols-2 rounded-xl border border-zinc-800 bg-zinc-900/60 p-1">
        <button id="tab-mine" class="tab-btn rounded-lg py-2 text-sm font-medium transition-colors" data-tab="mine">My Names</button>
        <button id="tab-home" class="tab-btn rounded-lg py-2 text-sm font-medium transition-colors" data-tab="home">Home</button>
      </nav>
    </header>

    <section id="screen-mine" class="flex flex-col items-center gap-5">
      <div class="rounded-xl border border-zinc-800 bg-zinc-900/60 p-6 w-full flex flex-col items-center gap-4">
        <button id="generate-btn" class="px-8 py-4 rounded-full bg-violet-600 hover:bg-violet-500 active:scale-95 transition-all text-white text-lg font-bold shadow-lg shadow-violet-600/30">
          Generate
        </button>
        <p class="text-xs text-zinc-500">Tap to create a random two-word name</p>
      </div>

      <div class="w-full flex flex-col gap-2">
        <h2 class="text-sm font-medium text-zinc-500 px-1">My names</h2>
        <div id="mine-list" class="flex flex-col gap-2"></div>
      </div>
    </section>

    <section id="screen-home" class="hidden flex-col gap-2">
      <h2 class="text-sm font-medium text-zinc-500 px-1">Shared by everyone</h2>
      <div id="feed-list" class="flex flex-col gap-2"></div>
    </section>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const headers = token ? { 'x-usernode-token': token } : {};
    const jsonHeaders = { 'Content-Type': 'application/json', ...headers };

    const tabs = {
      mine: { btn: document.getElementById('tab-mine'), screen: document.getElementById('screen-mine') },
      home: { btn: document.getElementById('tab-home'), screen: document.getElementById('screen-home') },
    };

    function activeTabClasses(isActive) {
      return isActive
        ? ['bg-violet-600', 'text-white']
        : ['text-zinc-400', 'hover:text-zinc-200'];
    }

    function showTab(name) {
      if (!tabs[name]) name = 'mine';
      for (const key of Object.keys(tabs)) {
        const { btn, screen } = tabs[key];
        const isActive = key === name;
        screen.classList.toggle('hidden', !isActive);
        screen.classList.toggle('flex', isActive);
        btn.classList.remove('bg-violet-600', 'text-white', 'text-zinc-400', 'hover:text-zinc-200');
        btn.classList.add(...activeTabClasses(isActive));
      }
      if (name === 'home') loadFeed();
      if (name === 'mine') loadMine();
    }

    function tabFromHash() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      return hash === 'home' ? 'home' : 'mine';
    }

    tabs.mine.btn.addEventListener('click', () => { window.location.hash = '#/mine'; });
    tabs.home.btn.addEventListener('click', () => { window.location.hash = '#/home'; });
    window.addEventListener('hashchange', () => showTab(tabFromHash()));

    function timeAgo(iso) {
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (seconds < 60) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      const days = Math.floor(hours / 24);
      return days + 'd ago';
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function renderMine(names) {
      const el = document.getElementById('mine-list');
      if (!names.length) {
        el.innerHTML = '<p class="text-center text-zinc-600 text-sm py-6">No names yet. Tap Generate to make your first one!</p>';
        return;
      }
      el.innerHTML = names.map((n) => `
        <div class="flex items-center justify-between gap-3 rounded-lg border border-zinc-800 bg-zinc-900/60 px-4 py-3">
          <span class="font-semibold">${escapeHtml(n.name)}</span>
          <button data-id="${n.id}" class="share-btn shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full transition-colors ${n.shared ? 'bg-zinc-800 text-zinc-500 cursor-default' : 'bg-violet-600 hover:bg-violet-500 text-white'}" ${n.shared ? 'disabled' : ''}>
            ${n.shared ? 'Shared' : 'Share'}
          </button>
        </div>
      `).join('');

      el.querySelectorAll('.share-btn:not([disabled])').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          btn.disabled = true;
          try {
            const res = await fetch(`/api/names/${id}/share`, { method: 'POST', headers: jsonHeaders });
            if (res.ok) {
              loadMine();
            } else {
              btn.disabled = false;
            }
          } catch {
            btn.disabled = false;
          }
        });
      });
    }

    function renderFeed(feed) {
      const el = document.getElementById('feed-list');
      if (!feed.length) {
        el.innerHTML = '<p class="text-center text-zinc-600 text-sm py-6">No names shared yet</p>';
        return;
      }
      el.innerHTML = feed.map((f) => `
        <div class="flex items-center justify-between gap-3 rounded-lg border border-zinc-800 bg-zinc-900/60 px-4 py-3">
          <div class="flex flex-col">
            <span class="font-semibold">${escapeHtml(f.name)}</span>
            <span class="text-xs text-zinc-500">@${escapeHtml(f.username)}</span>
          </div>
          <span class="text-xs text-zinc-600 shrink-0">${timeAgo(f.shared_at)}</span>
        </div>
      `).join('');
    }

    function renderSignedOut(elId, message) {
      document.getElementById(elId).innerHTML =
        `<p class="text-center text-zinc-600 text-sm py-6">${escapeHtml(message)}</p>`;
    }

    async function loadMine() {
      if (!token) return renderSignedOut('mine-list', 'Open this app in Usernode to see your names.');
      try {
        const res = await fetch('/api/names', { headers });
        if (!res.ok) return;
        const { names } = await res.json();
        renderMine(names);
      } catch {}
    }

    async function loadFeed() {
      if (!token) return renderSignedOut('feed-list', 'Open this app in Usernode to see the feed.');
      try {
        const res = await fetch('/api/feed', { headers });
        if (!res.ok) return;
        const { feed } = await res.json();
        renderFeed(feed);
      } catch {}
    }

    document.getElementById('generate-btn').addEventListener('click', async () => {
      if (!token) return;
      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/generate', { method: 'POST', headers: jsonHeaders });
        if (res.ok) loadMine();
      } finally {
        btn.disabled = false;
      }
    });

    showTab(tabFromHash());
  </script>
</body>
</html>
